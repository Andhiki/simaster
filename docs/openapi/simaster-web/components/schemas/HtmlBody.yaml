type: string
description: |
  A server-rendered HTML body — a full page (login form, dashboard shell)
  or a fragment loaded into it. This surface returns HTML, not JSON
  (`X-Requested-With: XMLHttpRequest`, `Accept: text/html`). Response
  schemas throughout this document describe the HTTP behavior; the HTML
  structure itself is documented by example captures, not schemas, because
  the markup is not a contract.
