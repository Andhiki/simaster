openapi: 3.1.0
info:
  title: SIMASTER Web API
  version: 0.1.0
  summary: Session-cookie HTML API behind UGM CAS SSO.
  license:
    name: MIT OR Apache-2.0
  description: |
    The `simaster.ugm.ac.id` portal surface (L3 in `docs/API-MAP.md`), documented
    from captured browser traffic and prior-art client analysis.

    Evidence rules (see `docs/API-MAP.md` and issue #51):

    - Every operation carries `x-provenance` (the capture or client file the
      claim comes from), `x-status`, and `x-live-tested`.
    - `x-status` uses the `docs/API-MAP.md` status legend. Nothing on this
      surface is documented by UGM, so every operation is `unverified` —
      upstream behavior is observed, not guaranteed.
    - `x-live-tested: true` means the behavior was observed in captured
      traffic: user-supplied HAR captures from 2026-11-11, recorded with
      authorization in issue #52. `x-live-tested: false` marks prior-art
      claims only. Sanitized fixtures and contract tests land with the M3
      read adapters (issue #40); until then these captures are the only
      recorded evidence.
    - Responses are **HTML fragments, not JSON**. Data extraction requires HTML
      parsing; there is no observed JSON envelope on this surface.
    - Authentication is a CAS v1 login form (`sso.ugm.ac.id`), followed by a
      mandatory CAPTCHA challenge. The full observed flow:

      1. `GET sso.ugm.ac.id/cas/login` — login form, supplies the `lt` field.
      2. `POST sso.ugm.ac.id/cas/login` — `302` to `signin_proses?ticket=…`.
      3. `GET /ugmfw/signin_simaster/signin_proses` — redirect chain to the
         CAPTCHA page (includes an `http`→`https` round-trip).
      4. `GET /ugmfw/signin_simaster/captchasound_verification`.
      5. `POST /ugmfw/signin_simaster/captchasound_verification` — `302` to
         `/beranda/beranda/` on success.

    - Write operations are out of scope for this surface (milestone M5 governs
      any future writes).
servers:
  - url: https://simaster.ugm.ac.id
tags:
  - name: auth
    description: CAS login and CAPTCHA-gated session establishment.
  - name: beranda
    description: Dashboard HTML partials.
  - name: akademik
    description: Student academic data pages (HTML).
security:
  - sessionCookie: []
