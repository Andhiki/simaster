[package]
name = "simaster-cli"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Andhiki/simaster"
homepage = "https://github.com/Andhiki/simaster"
description = "Unofficial terminal-first CLI for SIMASTER UGM: scriptable, JSON-first, agent-friendly"
readme = "README.md"
keywords = ["cli", "ugm", "simaster", "student", "api"]
categories = ["command-line-utilities"]

[[bin]]
name = "simaster"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
