name: Authentication issue
description: Report a reproducible authentication problem without sharing credentials.
title: "auth: "
labels: ["area:auth", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Authentication reports are sensitive. **Never paste a password, cookie,
        access token, refresh token, ID token, authorization code, PKCE verifier,
        or client secret.** Use placeholders such as `<token>` and `<cookie>`.

        If this is a vulnerability, use the private Security Advisory link
        instead of this form.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `simaster --version`.
      placeholder: "simaster 0.1.0-alpha.1"
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Authentication method
      options:
        - auto
        - browser (UGM ID OAuth2 + PKCE)
        - web (session)
        - sso (CAS)
        - cookie import (not scheduled)
        - Other
    validations:
      required: true
  - type: dropdown
    id: client-id
    attributes:
      label: Is SIMASTER_CLIENT_ID configured?
      description: Answer yes/no only. Do not paste the client ID or a client secret.
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: pkce-step
    attributes:
      label: Browser PKCE step
      description: Where did the browser flow stop?
      options:
        - Not applicable (web or SSO fallback)
        - Opening the authorization URL
        - CAS SSO or consent
        - Loopback callback or state check
        - Token exchange
        - ID-token validation
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command, with the username replaced by `<username>`.
      placeholder: "simaster auth login --method web --username <username>"
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: Symptom and error
      description: The sanitized error message and exit code.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps with credentials and personal data removed.
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Credential storage
      options:
        - OS keyring
        - File fallback (0600)
        - Not sure
        - Not applicable
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction checklist
      options:
        - label: I removed passwords, cookies, access/refresh/ID tokens, authorization codes, PKCE verifiers, and client secrets.
          required: true
        - label: I removed names, NIU numbers, and other personal data.
          required: true
        - label: I did not include the official mobile app's client ID, embedded secret, or custom-scheme redirect.
          required: true
        - label: I used only my own account.
          required: true
        - label: This is not a security vulnerability; security reports use GitHub Security Advisories.
          required: true
